name: Apply V4.6.6 branch changes

on:
  push:
    branches:
      - v4.6.6-mobile-pendientes
    paths:
      - .github/workflows/apply-v466.yml

permissions:
  contents: write

jobs:
  apply-v466:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v4.6.6-mobile-pendientes
          fetch-depth: 0

      - name: Apply V4.6.6 directly
        run: node .github/scripts/apply-v466.mjs

      - name: Validate JavaScript syntax
        run: node --check installer/payload/.obsidian/plugins/jarvis-core/main.js

      - name: Validate versions
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "4.6.6"
          node -e "const fs=require('fs'); for (const p of ['installer/payload/.obsidian/plugins/jarvis-core/manifest.json','installer/payload/.obsidian/plugins/jarvis-local-ai/manifest.json']) { const j=JSON.parse(fs.readFileSync(p,'utf8')); if(j.version!=='4.6.6') process.exit(1); }"

      - name: Remove one-shot workflow files
        shell: bash
        run: |
          rm -f .github/workflows/apply-v466.yml
          rm -f .github/scripts/apply-v466.mjs

      - name: Commit branch implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "V4.6.6 mobile reminders and pending-query fixes [skip ci]"
          git push origin HEAD:v4.6.6-mobile-pendientes

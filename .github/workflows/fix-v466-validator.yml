name: Fix V4.6.6 runtime validator

on:
  push:
    branches:
      - v4.6.6-mobile-pendientes
    paths:
      - .github/workflows/fix-v466-validator.yml

permissions:
  contents: write

jobs:
  fix-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v4.6.6-mobile-pendientes
          fetch-depth: 0

      - name: Make validator version-aware
        shell: python
        run: |
          from pathlib import Path

          repo = Path.cwd()
          version = (repo / "VERSION").read_text(encoding="utf-8").strip()
          if version != "4.6.6":
              raise SystemExit(f"Expected VERSION 4.6.6, got {version!r}")

          validator = repo / "installer" / "validar_activacion_jarvis.ps1"
          text = validator.read_text(encoding="utf-8-sig")

          marker = "$ErrorActionPreference = 'Stop'\n"
          version_block = """$ErrorActionPreference = 'Stop'\n\n$VersionFile = Join-Path (Split-Path -Parent $PSScriptRoot) 'VERSION'\n$ExpectedVersion = ''\nif (Test-Path -LiteralPath $VersionFile) {\n    $ExpectedVersion = (Get-Content -LiteralPath $VersionFile -Raw -Encoding UTF8).Trim()\n}\nif ([string]::IsNullOrWhiteSpace($ExpectedVersion)) {\n    $manifestPath = Join-Path $PSScriptRoot 'payload\\.obsidian\\plugins\\jarvis-core\\manifest.json'\n    $manifest = Read-JsonSafe $manifestPath\n    if ($null -ne $manifest) { $ExpectedVersion = [string]$manifest.version }\n}\nif ([string]::IsNullOrWhiteSpace($ExpectedVersion)) { $ExpectedVersion = '4.6.6' }\n"""

          if "$ExpectedVersion" not in text:
              if marker not in text:
                  raise SystemExit("Could not find ErrorActionPreference marker in validator")
              text = text.replace(marker, version_block, 1)

          text = text.replace("[string]$runtime.version -eq '4.6.5'", "[string]$runtime.version -eq $ExpectedVersion")
          text = text.replace("Write-Host '       VALIDACION REAL DE JARVIS V4.6.5'", "Write-Host (\"       VALIDACION REAL DE JARVIS V{0}\" -f $ExpectedVersion)")

          if "-eq '4.6.5'" in text or "VALIDACION REAL DE JARVIS V4.6.5" in text:
              raise SystemExit("Hardcoded V4.6.5 remains in validator")
          if text.count("-eq $ExpectedVersion") < 2:
              raise SystemExit("Runtime and dashboard version checks were not both updated")

          validator.write_text(text, encoding="utf-8-sig", newline="\n")

          bat = repo / "installer" / "INSTALAR_JARVIS_UNIVERSAL.bat"
          b = bat.read_text(encoding="utf-8-sig")
          b = b.replace("title JARVIS V4.6.5 - INSTALADOR UNIVERSAL", "title JARVIS V%JARVIS_VERSION% - INSTALADOR UNIVERSAL")
          b = b.replace("echo             JARVIS V4.6.5 - INSTALADOR UNIVERSAL", "echo             JARVIS V%JARVIS_VERSION% - INSTALADOR UNIVERSAL")
          if "set \"JARVIS_VERSION=" not in b:
              anchor = "cd /d \"%~dp0\"\n"
              block = """cd /d \"%~dp0\"\nset \"JARVIS_VERSION=\"\nfor /f \"usebackq delims=\" %%V in (\"%~dp0..\\VERSION\") do if not defined JARVIS_VERSION set \"JARVIS_VERSION=%%V\"\nif not defined JARVIS_VERSION set \"JARVIS_VERSION=4.6.6\"\n"""
              if anchor not in b:
                  raise SystemExit("Could not find BAT cd anchor")
              b = b.replace(anchor, block, 1)
          if "V4.6.5 - INSTALADOR UNIVERSAL" in b:
              raise SystemExit("Hardcoded V4.6.5 remains in installer BAT")
          bat.write_text(b, encoding="utf-8", newline="\r\n")

          workflow = repo / ".github" / "workflows" / "fix-v466-validator.yml"
          workflow.unlink()

      - name: Validate PowerShell syntax and version wiring
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'installer/validar_activacion_jarvis.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          $v = (Get-Content VERSION -Raw).Trim()
          $validator = Get-Content installer/validar_activacion_jarvis.ps1 -Raw
          if ($v -ne '4.6.6') { throw "VERSION is $v" }
          if ($validator -notmatch '\$ExpectedVersion') { throw 'ExpectedVersion not wired' }
          if ($validator -match "runtime\.version -eq '4\.6\.5'") { throw 'Validator still expects 4.6.5' }

      - name: Commit validator fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V4.6.6 fix runtime validator version detection [skip ci]"
          git push origin HEAD:v4.6.6-mobile-pendientes
